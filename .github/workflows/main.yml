name: Manifest Validation Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Backend Deployment
        run: |
          kubeconform backend/deployment.yml

      - name: Validate Backend Service
        run: |
          kubeconform backend/service.yml

      - name: Validate Frontend Deployment
        run: |
          kubeconform frontend/deployment.yml

      - name: Validate Frontend Service
        run: |
          kubeconform frontend/service.yml

      - name: Success
        run: echo "All Kubernetes manifests are valid."
